<script>
(() => {
  const HB   = JSON.parse(document.getElementById('data-heartbeats').textContent);
  const META = JSON.parse(document.getElementById('data-meta').textContent);
  const GEN  = "2026-11-23T18:55:02Z";

  // monitor-id -> naam (in Kuma 2 wonen monitoren binnen de groepen)
  const names = {};
  const groups = META.publicGroupList || [];
  for (const g of groups) {
    for (const m of (g.monitorList || [])) {
      names[m.id] = m.name;
    }
  }

  let allUp = true;
  const rows = [];
  for (const [id, list] of Object.entries(HB.heartbeatList || {})) {
    const last = (list && list.length) ? list[list.length - 1] : null;
    const up = !!last && Number(last.status) === 1;
    allUp = allUp && up;
    rows.push({ name: names[id] || ('#' + id), up });
  }
  rows.sort((a, b) => a.name.localeCompare(b.name));

  const banner = document.getElementById('banner');
  if (rows.length === 0) {
    banner.textContent = "No public monitors configured";
    banner.className = "banner warn";
  } else {
    banner.textContent = allUp ? "All systems operational"
                               : "Some services are having issues";
    banner.className = "banner " + (allUp ? "ok" : "warn");
  }

  const tb = document.querySelector('#services tbody');
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.className = r.up ? 'up' : 'dn';
    const dot = document.createElement('td');
    dot.className = 'st';
    dot.innerHTML = '<span class="dot"></span>';
    const nm = document.createElement('td');
    nm.textContent = r.name;              // textContent = XSS-veilig
    tr.append(dot, nm);
    tb.appendChild(tr);
  }

  document.getElementById('ts').textContent =
    new Date(GEN).toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' })
    + ' CET';
})();
</script>
